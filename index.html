<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusKart - Student Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🎓 CampusKart</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#buy">Buy</a></li>
                <li><a href="#sell">Sell</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Welcome to CampusKart</h1>
        <p>Buy and sell used items like books, laptops, and furniture with fellow students. Save money, reduce waste!</p>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search for products...">
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="books">Books</option>
                <option value="furniture">Furniture</option>
                <option value="electronics">Electronics</option>
            </select>
        </div>
        <button id="sell-btn" class="sell-btn">Sell Item</button>
    </section>

    <section id="buy" class="products">
        <h2>Featured Products</h2>
        <div id="product-grid" class="product-grid">
            <!-- Products will be dynamically inserted here -->
        </div>
    </section>

    <footer>
        <p>© 2025 CampusKart | Made by Students for Students</p>
    </footer>

    <!-- Sell Item Modal -->
    <div id="sell-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Sell Your Item</h2>
            <form id="sell-form">
                <label for="item-name">Item Name:</label>
                <input type="text" id="item-name" required>
                <label for="item-price">Price (₹):</label>
                <input type="number" id="item-price" required>
                <label for="item-image">Image URL:</label>
                <input type="url" id="item-image" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
